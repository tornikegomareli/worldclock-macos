name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tuist
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: Build
        run: |
          xcodebuild build \
            -workspace WorldClock.xcworkspace \
            -scheme WorldClock \
            -destination "platform=macOS" \
            -quiet

      - name: Test
        run: |
          xcodebuild test \
            -workspace WorldClock.xcworkspace \
            -scheme WorldClock \
            -destination "platform=macOS" \
            -quiet

      - name: Check release scripts
        run: |
          bash -n Scripts/release.sh Scripts/publish-release.sh Scripts/sign-weather-app.sh Scripts/generate-cask.sh
          node --test Scripts/validate-release.test.mjs Scripts/publish-release.test.mjs
